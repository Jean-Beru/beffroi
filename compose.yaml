# Development stack of the monorepo.
#
#   docker compose up -d                          the OP on https://op.localhost and PostgreSQL
#   docker compose --profile conformance up -d    plus the OpenID conformance suite on https://localhost:8443
#
# The OP answers on op.localhost for the browser (every *.localhost name is loopback) and for the
# conformance suite container (network alias). Caddy issues the certificate from its internal CA;
# that CA is imported into the Java truststore of the suite at start-up (tests/conformance/server-entrypoint.sh),
# with the certificate of the suite's own nginx, for the scripted browser of the suite (tests/conformance/README.md).
services:
  op:
    build:
      context: .
      dockerfile: apps/op/Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-op.localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-heidi}:${POSTGRES_PASSWORD:-heidi}@database:5432/${POSTGRES_DB:-heidi}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-heidi}:${RABBITMQ_PASSWORD:-heidi}@rabbitmq:5672/%2f/messages
      # https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # Both documented in apps/op/.env; "castor start --conformance" sets them for a stack that serves the suite.
      APP_PROFILER: ${APP_PROFILER:-1}
      CONFORMANCE_ACCESS_TOKEN_FORMAT: ${CONFORMANCE_ACCESS_TOKEN_FORMAT:-jwt}
    volumes:
      - ./apps/op:/app
      - ./src:/src
      - /app/var/
      # The sealed signing keys are files (architecture §3.3): the process that serves them and the process
      # that rotates them (the worker below) share the directory, or a rotation would change nothing here.
      - keys_data:/app/var/keys
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    networks:
      default:
        aliases:
          - op.localhost
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    tty: true

  # The worker of architecture §5.6, one in development: the three transports of the buses and the schedule
  # of the bundle ("scheduler_heidi": the timed steps of the key lifecycle, §3.3). One process consumes the
  # schedule; the buses could have more. Same image, no HTTP, restarted every hour by Messenger itself.
  worker:
    build:
      context: .
      dockerfile: apps/op/Dockerfile
      target: frankenphp_dev
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "scheduler_heidi", "async_priority_high", "async_priority_medium", "async_priority_low", "--time-limit=3600", "--memory-limit=256M"]
    # The image checks Caddy; a worker is healthy while the consumer is its first process.
    healthcheck:
      test: ["CMD-SHELL", "grep -q messenger:consume /proc/1/cmdline"]
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heidi}:${POSTGRES_PASSWORD:-heidi}@database:5432/${POSTGRES_DB:-heidi}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-heidi}:${RABBITMQ_PASSWORD:-heidi}@rabbitmq:5672/%2f/messages
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      APP_PROFILER: 0
      CONFORMANCE_ACCESS_TOKEN_FORMAT: ${CONFORMANCE_ACCESS_TOKEN_FORMAT:-jwt}
    # The image's HEALTHCHECK probes the Caddy admin API (port 2019), which this process does not run. A
    # dead consumer exits and the restart policy brings it back; there is nothing else to probe.
    healthcheck:
      disable: true
    volumes:
      - ./apps/op:/app
      - ./src:/src
      - /app/var/
      - keys_data:/app/var/keys
    depends_on:
      op:
        condition: service_healthy
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heidi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heidi}
      POSTGRES_USER: ${POSTGRES_USER:-heidi}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-heidi}", "-U", "${POSTGRES_USER:-heidi}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-4}-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-heidi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-heidi}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # OpenID Foundation conformance suite, prebuilt images from gitlab.com/openid/conformance-suite.
  # Test plan for spike 1: oidcc-basic-certification-test-plan (tests/conformance/).
  conformance-mongodb:
    image: mongo:6.0.13
    profiles: [conformance]
    networks:
      default:
        aliases:
          # The suite jar connects to "mongodb" whatever the property says
          - mongodb
    volumes:
      - conformance_mongo:/data/db

  conformance-server:
    image: registry.gitlab.com/openid/conformance-suite:${CONFORMANCE_SUITE_VERSION:-release-v5.2.1}
    profiles: [conformance]
    # Same environment as the official docker-compose-prebuilt.yml: the dev Spring profile needs no
    # login, but the OAuth registrations must be non-empty for the context to start.
    environment:
      BASE_URL: https://localhost:8443
      BASE_MTLS_URL: https://localhost:8444
      MONGODB_HOST: conformance-mongodb
      SPRING_PROFILES_ACTIVE: dev
      JAVA_EXTRA_ARGS: -Dfintechlabs.devmode=true
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    entrypoint: ["/bin/sh", "/entrypoint/server-entrypoint.sh"]
    volumes:
      - ./tests/conformance/server-entrypoint.sh:/entrypoint/server-entrypoint.sh:ro
      - caddy_data:/caddy:ro
    networks:
      default:
        aliases:
          # The nginx image proxies to http://server:8080
          - server
    depends_on:
      - conformance-mongodb
      - op
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  conformance-nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:${CONFORMANCE_NGINX_VERSION:-release-v5.2.0}
    profiles: [conformance]
    ports:
      - "8443:8443"
      - "8444:8444"
    depends_on:
      - conformance-server

  # The scripted browser of the suite runs inside the JVM of conformance-server and is redirected by the OP
  # to https://localhost:8443/test/a/<alias>/callback, the same URL a browser on the host reaches. Inside
  # that container, localhost is the container: this sidecar shares its network namespace and forwards the
  # loopback port 8443 to nginx. The suite does the same with "fintechlabs.startredir" and the redir binary,
  # which the prebuilt image does not ship.
  conformance-redirector:
    image: alpine/socat:${CONFORMANCE_SOCAT_VERSION:-1.8.0.3}
    profiles: [conformance]
    network_mode: "service:conformance-server"
    command: TCP-LISTEN:8443,fork,reuseaddr,bind=127.0.0.1 TCP:conformance-nginx:8443
    depends_on:
      - conformance-server
      - conformance-nginx

volumes:
  keys_data:
  caddy_data:
  rabbitmq_data:
  caddy_config:
  database_data:
  conformance_mongo:
