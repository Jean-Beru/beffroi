# Split configuration for jderusse/gitsplit. Each directory below is mirrored, read only, into
# its own package repository. A mirror carries the maintained branches and the release tags
# listed under origins, and nothing else; the monorepo is where the work happens.
#
# The tag pattern is the one laminas/automatic-releases writes when a version milestone is
# closed: the milestone title itself, without a "v".
#
# There is no cache_url, and there must not be one while the monorepo is private. With a cache
# url, gitsplit keeps a persistent cache repository and updates it from origin before every
# run; the container holds no credential for origin and the run dies on "could not read
# Username for https://github.com". Without one it builds a temporary repository from the
# objects of the working copy, and the fetch of origin is a warning it walks past.

splits:
  - prefix: "src/core"
    target: "https://${GH_TOKEN}@github.com/beffroi-php/heidi-core.git"
  - prefix: "src/oidc"
    target: "https://${GH_TOKEN}@github.com/beffroi-php/heidi-oidc.git"
  - prefix: "src/symfony"
    target: "https://${GH_TOKEN}@github.com/beffroi-php/heidi-symfony-bundle.git"

origins:
  - ^\d+\.\d+\.x$
  - ^\d+\.\d+\.\d+$
