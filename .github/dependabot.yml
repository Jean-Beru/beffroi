version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      symfony:
        patterns: ["symfony/*"]
      dev:
        dependency-type: development
  - package-ecosystem: composer
    directory: /apps/beffroi
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      symfony:
        patterns: ["symfony/*"]
  - package-ecosystem: composer
    directory: /apps/tui
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      symfony:
        patterns: ["symfony/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/beffroi
    target-branch: "0.1.x"
    schedule:
      interval: daily
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
