name: Configuration reference

on:
  push:
    branches:
      - '*.*.x'
  pull_request:
    paths:
      - '.github/workflows/configuration-reference.yml'
      - '.castor/stack/qa.php'
      - 'src/symfony/src/HeidiBundle.php'
      - 'apps/op/composer.json'
      - 'apps/op/composer.lock'
      - 'apps/op/config/bundles.php'
      - 'apps/op/config/reference.php'
      - 'apps/op/config/schema.json'
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# apps/op/config/reference.php and apps/op/config/schema.json are written by the kernel of the application
# when it compiles its container, from the configuration trees of the bundles it has installed, and both are
# committed: an editor reads them to complete a "heidi.*" key, a reader of the repository reads them to know
# what the bundle takes. Nothing else writes them, so the check boots the application and fails when either
# file comes back different, naming it and printing the diff ("castor config-reference", .castor/stack/qa.php).
#
# A workflow of its own rather than a step of the quality job of ci.yml, and the reason is the lean CI rule:
# this is the only check of a pull request that needs the Composer install of apps/op (the conformance job is
# the other place that installs it, and it runs on a maintenance branch alone), and "paths" is what keeps a
# pull request that moves no configuration tree from paying for it. The list is narrow on purpose; the push to
# a maintenance branch runs the check whatever changed, so a tree that moves somewhere the list does not name
# is caught at the merge and not months later.

jobs:
  reference:
    name: "Generated configuration reference and schema"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # PHP on the host, not the phpqa image: the application is booted here, and none of the tools that
      # image carries (735 MB, pulled before the first step) is used.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      # The application is pinned by its own lock, the way a developer runs it. Without its scripts: what is
      # compiled here is the container, and the assets the auto-scripts install are no part of it.
      - uses: ramsey/composer-install@v4
        with:
          working-directory: apps/op
          dependency-versions: locked
          composer-options: --optimize-autoloader --no-scripts
      - name: "Install Castor"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/castor" https://github.com/jolicode/castor/releases/download/v1.7.0/castor.linux-amd64
          chmod +x "${RUNNER_TEMP}/castor"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: "The reference and the schema against the configuration trees"
        run: castor config-reference
