name: CI

on:
  push:
    branches:
      - '*.*.x'
    tags: ['*']
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Quality and tests run on the latest PHP only for now (the "env" context is not available in
# "container.image", hence the literal version in every job). The test matrix stays in place so
# that older versions can be re-added by listing them (see the "tests" job).
#
# Every job with "container:" pulls the phpqa image on a fresh runner (735 MB compressed, 3.3 GB
# extracted) before its first step, out of reach of actions/cache. The quality checks therefore
# share one job: one pull and one Composer install instead of one of each per tool. The steps run
# to the end whatever the outcome of the previous ones, so that every tool reports its verdict.

jobs:
  pre_checks:
    name: "0️⃣ Pre-checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Check file permissions"
        run: |
          NON_EXECUTABLE=$(find . -type f -not -path './.git/*' -not -name '*.sh' -not -path './apps/*/bin/*' -executable)
          if [[ -n "$NON_EXECUTABLE" ]]; then
            echo "Found non-executable files with executable permission:"
            echo "$NON_EXECUTABLE"
            exit 1
          fi
      - name: "Find non-printable ASCII characters"
        run: |
          if LC_ALL=C.UTF-8 find . -type f -name "*.php" -print0 | xargs -0 grep -PHn "[[:cntrl:]]"; then
            echo "Non-printable ASCII characters found"
            exit 1
          fi

  quality:
    name: "1️⃣ Quality (PHPStan, Mago, Rector, composer.json, syntax, licenses, Deptrac)"
    needs: [pre_checks]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - id: dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - name: "Static Analysis (PHPStan)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor phpstan
      # Mago is a Rust binary the phpqa image already carries (/tools/mago); nothing is installed for
      # it here and it needs no PHP runtime. It reads mago.toml at the root of the repository.
      - name: "Formatting (Mago)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor mago-format
      - name: "Coding Standards (Mago)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor mago-lint
      - name: "Refactoring (Rector)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor rector
      - name: "Validate composer.json"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          composer dump-autoload --optimize --strict-psr
          composer validate --strict
          for f in src/*/composer.json; do composer validate --strict --no-check-all "$f"; done
      - name: "Syntax Check"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer exec -- parallel-lint src tests
      - name: "License Check"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor check-licenses
      - name: "Architecture Layer Check (Deptrac)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor deptrac

  tests:
    name: "2️⃣ Tests (PHP ${{ matrix.php-version }})"
    needs: [quality]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:${{ matrix.php-version }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - php-version: '8.4'
          #   experimental: false
          - php-version: '8.5'
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor phpunit
      # The XML coverage and the JUnit report feed the mutation testing job, which does not run the tests again.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-php${{ matrix.php-version }}
          path: .ci-tools/coverage
          retention-days: 1
          if-no-files-found: error

  key_file:
    name: "5️⃣ Key custody (key file)"
    needs: [quality]
    # What seals and unseals, the kernel sealing with the sodium key read from a file instead of the
    # environment (issue #58, the self-hosted default without a KMS): the custody of the signing keys
    # (Functional/Key: the envelope names the key file of the tenant, the file is the process's alone,
    # a sealed key is opened and signs) and of the shared secrets of the TOTP (Functional/Security), only
    # the DSN changing. Nothing else of the bundle suite reads the DSN, so nothing else runs here again:
    # the whole suite against this backend was five minutes behind "Tests" for the same proof. The file is
    # written the way "castor provision --kms file" writes it: 32 bytes, mode 0600, in a directory 0700
    # of its own. One backend here, the fastest: the others (Vault Transit, AWS KMS on LocalStack) are the
    # business of symfony/key-management and of its bridges, and their custody tests run on the
    # development stack (VaultTransitCustodyTest, AwsKmsCustodyTest, skipped without their DSN).
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - name: "Write the key of the tenant"
        run: |
          mkdir -m 700 "${RUNNER_TEMP}/kms"
          (umask 077 && head -c 32 /dev/urandom > "${RUNNER_TEMP}/kms/heidi-default.key")
          echo "HEIDI_TEST_KMS_DSN=sodium+dir://${RUNNER_TEMP}/kms?ext=.key" >> "$GITHUB_ENV"
          echo "HEIDI_TEST_KMS_KEY_ID=heidi-{tenant}" >> "$GITHUB_ENV"
      - name: "Key custody against the key file"
        run: castor phpunit -- --no-coverage tests/symfony/Functional/Key tests/symfony/Functional/Security

  conformance:
    name: "4️⃣ OpenID Conformance (Basic, Config, Form Post, the three logout profiles, the four FAPI 2 runs)"
    needs: [tests]
    # The plans drive a real browser through a real OP: the host runs Docker, not the phpqa image. On a
    # maintenance branch only (and by hand): the ten runs take the better part of an hour, and a pull request
    # has the bundle suite; "castor conformance" runs the plans on the development stack before a merge that
    # touches them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      # The application is pinned by its own lock, the way a developer runs it; the monorepo jobs above
      # are the ones that follow the dev branches of Symfony.
      - uses: ramsey/composer-install@v4
        with:
          working-directory: apps/op
          dependency-versions: locked
          composer-options: --optimize-autoloader
      - name: "Install Castor"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/castor" https://github.com/jolicode/castor/releases/download/v1.7.0/castor.linux-amd64
          chmod +x "${RUNNER_TEMP}/castor"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: "Start the OP and the conformance suite"
        run: castor start --conformance --build
      - name: "Provision the OP"
        run: castor provision
      # --strict makes a WARNING a failure: what the plans must look like before anything is submitted.
      # REVIEW and SKIPPED stay accepted, no run of a plan can avoid them (tests/conformance/README.md).
      - name: "Run the certification plans"
        run: castor conformance --strict
      - name: "Logs of the stack"
        if: failure()
        run: docker compose --profile conformance logs --no-color --tail 400
      - name: "Stop the stack"
        if: always()
        run: castor stop

  infection:
    name: "3️⃣ Mutation Testing"
    needs: [tests]
    # Every run mutates only the lines added or modified: a pull request against its base branch, a push against
    # the commit before it (the pull request just merged). The whole source takes hours with the functional tests
    # covering most of it; "castor infect" without --diff stays a local, deliberate run.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && endsWith(github.ref, '.x') && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base branch and the merge base with it, not the single commit of a shallow clone.
          fetch-depth: 0
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      # The coverage of the tests job, same image, same checkout, same paths: Infection reads it as is.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-php8.5
          path: .ci-tools/coverage
      # Infection counts the two cores of the runner and keeps one for itself; both can run mutants.
      - name: "Mutations of the pull request"
        if: github.event_name == 'pull_request'
        run: castor infect --diff --reuse-coverage --base="origin/${{ github.base_ref }}" --threads=2
      - name: "Mutations of the push"
        if: github.event_name == 'push'
        run: castor infect --diff --reuse-coverage --base="${{ github.event.before }}" --threads=2
