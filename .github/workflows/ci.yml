name: CI

on:
  push:
    branches:
      - 'main'
      - '*.*.x'
    tags: ['*']
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Quality and tests run on the latest PHP only for now (the "env" context is not available in
# "container.image", hence the literal version in every job). The test matrix stays in place so
# that older versions can be re-added by listing them (see the "tests" job).

jobs:
  pre_checks:
    name: "0️⃣ Pre-checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Check file permissions"
        run: |
          NON_EXECUTABLE=$(find . -type f -not -path './.git/*' -not -name '*.sh' -not -path './apps/*/bin/*' -executable)
          if [[ -n "$NON_EXECUTABLE" ]]; then
            echo "Found non-executable files with executable permission:"
            echo "$NON_EXECUTABLE"
            exit 1
          fi
      - name: "Find non-printable ASCII characters"
        run: |
          if LC_ALL=C.UTF-8 find . -type f -name "*.php" -print0 | xargs -0 grep -PHn "[[:cntrl:]]"; then
            echo "Non-printable ASCII characters found"
            exit 1
          fi

  prepare_dependencies:
    name: "📦 Prepare Composer Dependencies"
    needs: [pre_checks]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

  phpstan:
    name: "1️⃣ Static Analysis (PHPStan)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor phpstan

  ecs:
    name: "2️⃣ Coding Standards (ECS)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor ecs

  rector:
    name: "3️⃣ Refactoring (Rector)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor rector

  validate:
    name: "4️⃣ Validate composer.json"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: |
          composer dump-autoload --optimize --strict-psr
          composer validate --strict
          for f in src/*/composer.json; do composer validate --strict --no-check-all "$f"; done

  lint:
    name: "5️⃣ Syntax Check"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - run: composer exec -- parallel-lint src tests

  check_licenses:
    name: "6️⃣ License Check"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor check-licenses

  deptrac:
    name: "7️⃣ Architecture Layer Check (Deptrac)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor deptrac

  tests:
    name: "8️⃣ Tests (PHP ${{ matrix.php-version }})"
    needs: [phpstan, ecs, rector, validate, lint, check_licenses, deptrac]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:${{ matrix.php-version }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - php-version: '8.4'
          #   experimental: false
          - php-version: '8.5'
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - run: castor phpunit
      # The XML coverage and the JUnit report feed the mutation testing job, which does not run the tests again.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-php${{ matrix.php-version }}
          path: .ci-tools/coverage
          retention-days: 1
          if-no-files-found: error

  conformance:
    name: "🔟 OpenID Conformance (Basic, Config, RP-Initiated Logout OP)"
    needs: [tests]
    # The plans drive a real browser through a real OP: the host runs Docker, not the phpqa image.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # The application is pinned by its own lock, the way a developer runs it; the monorepo jobs above
      # are the ones that follow the dev branches of Symfony.
      - uses: ramsey/composer-install@v4
        with:
          working-directory: apps/op
          dependency-versions: locked
          composer-options: --optimize-autoloader
      - name: "Install Castor"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/castor" https://github.com/jolicode/castor/releases/download/v1.7.0/castor.linux-amd64
          chmod +x "${RUNNER_TEMP}/castor"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: "Start the OP and the conformance suite"
        run: castor start --conformance --build
      - name: "Provision the OP"
        run: castor provision
      # --strict makes a WARNING a failure: what the plans must look like before anything is submitted.
      # REVIEW and SKIPPED stay accepted, no run of a plan can avoid them (tests/conformance/README.md).
      - name: "Run the certification plans"
        run: castor conformance --strict
      - name: "Logs of the stack"
        if: failure()
        run: docker compose --profile conformance logs --no-color --tail 400
      - name: "Stop the stack"
        if: always()
        run: castor stop

  infection:
    name: "9️⃣ Mutation Testing"
    needs: [tests]
    # Every run mutates only the lines added or modified: a pull request against its base branch, a push against
    # the commit before it (the pull request just merged). The whole source takes hours with the functional tests
    # covering most of it; "castor infect" without --diff stays a local, deliberate run.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || endsWith(github.ref, '.x')) && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base branch and the merge base with it, not the single commit of a shallow clone.
          fetch-depth: 0
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      # The coverage of the tests job, same image, same checkout, same paths: Infection reads it as is.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-php8.5
          path: .ci-tools/coverage
      # Infection counts the two cores of the runner and keeps one for itself; both can run mutants.
      - name: "Mutations of the pull request"
        if: github.event_name == 'pull_request'
        run: castor infect --diff --reuse-coverage --base="origin/${{ github.base_ref }}" --threads=2
      - name: "Mutations of the push"
        if: github.event_name == 'push'
        run: castor infect --diff --reuse-coverage --base="${{ github.event.before }}" --threads=2
