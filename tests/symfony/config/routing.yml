# The routes of the bundle, imported as an application imports them, next to a route of the host
# application that the plane guard must leave alone.
heidi:
    resource: '@HeidiBundle/config/routes.php'

host_route:
    path: /host
    controller: Heidi\Bundle\Tests\Functional\Controller\ProbeController
    defaults:
        plane: host
# The endpoints of the FIDO2 server API, imported as an application imports them in development, under a
# prefix of its own.
heidi_fido_conformance:
    resource: '@HeidiBundle/config/routes/fido-conformance.php'
    prefix: /fido/conformance
