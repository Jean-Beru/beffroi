# The routes of the bundle, imported as an application imports them, next to a route of the host
# application that the plane guard must leave alone.
beffroi:
    resource: '@BeffroiBundle/config/routes.php'

host_route:
    path: /host
    controller: Beffroi\Bundle\Tests\Functional\Controller\ProbeController
    defaults:
        plane: host

# The host application signing its own users in at the provider it hosts (issue #282).
host_application:
    resource: routing_host_application.yml

# The endpoints of the FIDO2 server API, imported as an application imports them in development, under a
# prefix of its own.
beffroi_fido_conformance:
    resource: '@BeffroiBundle/config/routes/fido-conformance.php'
    prefix: /fido/conformance

# What the certification suite answers a backchannel request with, imported the same way.
beffroi_ciba_conformance:
    resource: '@BeffroiBundle/config/routes/ciba-conformance.php'
    prefix: /ciba/conformance

# The pages of the profiler, as an application imports them in development: the one test that boots a
# kernel in debug reads the panel of the bundle through them.
web_profiler:
    resource: '@WebProfilerBundle/Resources/config/routing/profiler.php'
    prefix: /_profiler

web_profiler_wdt:
    resource: '@WebProfilerBundle/Resources/config/routing/wdt.php'
    prefix: /_wdt
