# A deployment whose issuer has a path, the routes of the provider mounted under it (routing_issuer_with_a_path.yml):
# what the provider hands a person to open is under that path once (issue #841).
framework:
    router:
        resource: '%kernel.project_dir%/config/routing_issuer_with_a_path.yml'

beffroi:
    tenant:
        issuer: 'https://op.test/idp'
