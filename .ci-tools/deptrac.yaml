# Layers of docs/11-architecture.md §2: three packages, four layers in each pure-PHP package.
# The identity core never depends on a protocol; protocols never depend on each other;
# nothing below the bundle knows Symfony's HTTP, DI or Doctrine.
deptrac:
  paths:
    - '../src'
  layers:
    - name: 'CoreDomain'
      collectors:
        - { type: directory, value: '../src/core/src/Domain/.*' }
        - { type: directory, value: '../src/core/src/Exception/.*' }
    - name: 'CorePort'
      collectors:
        - { type: directory, value: '../src/core/src/Port/.*' }
    - name: 'CoreApplication'
      collectors:
        - { type: directory, value: '../src/core/src/Application/.*' }
    - name: 'CoreBridge'
      collectors:
        - { type: directory, value: '../src/core/src/Bridge/.*' }
    - name: 'OidcDomain'
      collectors:
        - { type: directory, value: '../src/oidc/src/Domain/.*' }
        - { type: directory, value: '../src/oidc/src/Exception/.*' }
    - name: 'OidcPort'
      collectors:
        - { type: directory, value: '../src/oidc/src/Port/.*' }
    - name: 'OidcApplication'
      collectors:
        - { type: directory, value: '../src/oidc/src/Application/.*' }
    - name: 'OidcBridge'
      collectors:
        - { type: directory, value: '../src/oidc/src/Bridge/.*' }
    - name: 'Bundle'
      collectors:
        - { type: directory, value: '../src/symfony/.*' }
    - name: 'Psr'
      collectors:
        - { type: classLike, value: '^Psr\\' }
    - name: 'KeyManagement'
      collectors:
        - { type: classLike, value: '^Symfony\\Component\\KeyManagement\\' }
    - name: 'Uid'
      collectors:
        - { type: classLike, value: '^Symfony\\Component\\Uid\\' }
    - name: 'Jose'
      collectors:
        - { type: classLike, value: '^Jose\\' }
    - name: 'Webauthn'
      collectors:
        # webauthn-lib and cose-lib, the WebAuthn brick (docs/09-briques.md): the core reads its records and authenticator data, parses nothing; its Bridge runs the ceremonies on it
        - { type: classLike, value: '^Webauthn\\' }
        - { type: classLike, value: '^Cose\\' }
    - name: 'Pki'
      collectors:
        # spomky-labs/pki-framework, the X.509 brick (docs/09-briques.md): the Bridge of the protocol reads a client certificate with it, nothing else parses ASN.1
        - { type: classLike, value: '^SpomkyLabs\\Pki\\' }
    - name: 'Otphp'
      collectors:
        # spomky-labs/otphp and its base32, the TOTP brick (docs/09-briques.md): the Bridge of the core computes the codes and the provisioning URI on it, the core reads the steps
        - { type: classLike, value: '^OTPHP\\' }
        - { type: classLike, value: '^ParagonIE\\ConstantTime\\' }
    - name: 'WebPush'
      collectors:
        # spomky-labs/web-push-lib, the Web Push brick (docs/09-briques.md): the bundle encrypts a
        # notification to a browser and signs the request with it, nothing else speaks RFC 8291
        - { type: classLike, value: '^WebPush\\' }
    - name: 'QrCode'
      collectors:
        # bacon/bacon-qr-code, what draws the QR code of a TOTP enrolment as an SVG in the bundle (architecture §5.2): the pages embed it, nothing else reads it
        - { type: classLike, value: '^BaconQrCode\\' }
    - name: 'Serializer'
      collectors:
        # The serializer webauthn-lib reads the responses of the browser with and writes the options for it; a dependency of the brick, used by the Bridge of the core only through it
        - { type: classLike, value: '^Symfony\\Component\\Serializer\\' }
    - name: 'Symfony'
      collectors:
        # Everything of Symfony except the standalone components the pure-PHP packages may use, which have layers of their own above
        - { type: classLike, value: '^Symfony\\(?!Component\\(?:Uid|KeyManagement|Serializer)\\)' }
    - name: 'Doctrine'
      collectors:
        - { type: classLike, value: '^Doctrine\\' }
    - name: 'Twig'
      collectors:
        - { type: classLike, value: '^Twig\\' }
  ruleset:
    CoreDomain:
      - 'Psr'
      - 'Uid'
      - 'Webauthn'
    CorePort:
      - 'CoreDomain'
      - 'Psr'
      - 'Uid'
      - 'Webauthn'
    CoreApplication:
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'Uid'
      - 'Webauthn'
    CoreBridge:
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'Psr'
      - 'KeyManagement'
      - 'Uid'
      - 'Jose'
      - 'Webauthn'
      - 'Otphp'
      - 'Serializer'
    OidcDomain:
      - 'CoreDomain'
      - 'Psr'
      - 'Uid'
    OidcPort:
      - 'OidcDomain'
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'Uid'
    OidcApplication:
      - 'OidcDomain'
      - 'OidcPort'
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'Psr'
      - 'Uid'
    OidcBridge:
      - 'OidcDomain'
      - 'OidcPort'
      - 'OidcApplication'
      - 'CoreDomain'
      - 'CorePort'
      - 'Psr'
      - 'Jose'
      - 'Pki'
      - 'Uid'
    Bundle:
      - 'CoreDomain'
      - 'CorePort'
      - 'CoreApplication'
      - 'CoreBridge'
      - 'OidcDomain'
      - 'OidcPort'
      - 'OidcApplication'
      - 'OidcBridge'
      - 'Psr'
      - 'Symfony'
      - 'KeyManagement'
      - 'Uid'
      - 'Jose'
      - 'Webauthn'
      - 'Otphp'
      - 'WebPush'
      - 'QrCode'
      - 'Serializer'
      - 'Doctrine'
      - 'Twig'
