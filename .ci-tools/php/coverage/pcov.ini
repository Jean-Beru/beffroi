; Read on top of the image's own configuration, by the task that needs it and by no other
; ("phpqa()" in .castor/stack/qa.php, which puts this directory after the default one in
; PHP_INI_SCAN_DIR). The phpqa image ships pcov and turns it off in its phpqa.ini, because pcov
; instruments as soon as it is enabled: PHPStan, Rector and the linters must not pay for it.
;
; "pcov.directory" is left at its default, which is the working directory: naming the sources
; instead measured no faster (275 s against 284 s on the whole suite), so the narrower setting
; would buy a path that the two branches of phpqa() see differently and nothing else.
pcov.enabled=1
